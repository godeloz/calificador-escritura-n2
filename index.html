<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Calificación manual · Escritura, nivel 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap">
<style>
:root {
  --papel: #FCFCFA; --hoja: #FFFFFF; --tinta: #1A1A18; --tinta-2: #55534C; --tinta-3: #8A877E;
  --linea: #E4E1DA; --linea-2: #F0EEE8; --seleccion: #E6E3DB;
  --ok: #15803D; --ok-fondo: #E8F5EC; --err: #B91C1C; --err-fondo: #FBECEC;
  --sit: #1D4ED8; --coh: #B45309; --org: #6D28D9; --cor: #BE185D;
  /* Un color por criterio para sus marcas en el texto */
  --k1: #2563EB; --k2: #059669; --k3: #7C3AED; --k4: #DB2777; --k5: #64748B; --k6: #CA8A04; --k7: #EA580C;
  --k8: #65A30D; --k9: #0891B2; --k10: #92400E; --k11: #DC2626; --k12: #9F1239; --k13: #4338CA;
  --radio: 6px; --cab: 56px; --panel: 420px;
  --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif;
  --sombra: 0 8px 28px rgba(26, 26, 24, .14), 0 1px 3px rgba(26, 26, 24, .08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --papel: #16161A; --hoja: #1E1E23; --tinta: #ECEAE4; --tinta-2: #B5B2A9; --tinta-3: #85827A;
    --linea: #34343B; --linea-2: #28282E; --seleccion: #3A3A42;
    --ok: #4ADE80; --ok-fondo: #16301F; --err: #F87171; --err-fondo: #3A1C1C;
    --sit: #7FA2F7; --coh: #E59A55; --org: #B69CFB; --cor: #F07AB6;
    --k1: #7FA2F7; --k2: #34D399; --k3: #B69CFB; --k4: #F472B6; --k5: #94A3B8; --k6: #FACC15; --k7: #FB923C;
    --k8: #A3E635; --k9: #22D3EE; --k10: #D6A26C; --k11: #F87171; --k12: #FDA4AF; --k13: #A5B4FC;
    --sombra: 0 8px 28px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 400 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sit); outline-offset: 2px; }
[hidden] { display: none !important; }
.f-sit { --f: var(--sit); } .f-coh { --f: var(--coh); } .f-org { --f: var(--org); } .f-cor { --f: var(--cor); }

/* ── Botones ── */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--linea); border-radius: var(--radio); background: var(--hoja); font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--tinta-3); }
.btn.primario { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.btn.primario:hover { opacity: .9; }
.btn.peligro { color: var(--err); }
.btn.fantasma { border-color: transparent; background: transparent; }
.btn.fantasma:hover { background: var(--linea-2); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.chico { height: 26px; padding: 0 8px; font-size: 12px; }

/* ── Cabecera ── */
.cabecera { height: var(--cab); display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--linea); background: var(--hoja); position: relative; z-index: 30; }
.marca { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.marca b { font-weight: 600; font-size: 14px; }
.marca span { font-size: 12px; color: var(--tinta-3); }
.cab-eval { flex: 1; min-width: 0; font-size: 13px; color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cab-eval b { color: var(--tinta); font-weight: 500; }
.cab-total { display: flex; align-items: baseline; gap: 6px; }
.cifra { font-family: var(--serif); font-size: 28px; font-variant-numeric: tabular-nums lining-nums; font-weight: 500; letter-spacing: -.01em; }
.cifra-de { font-family: var(--serif); color: var(--tinta-3); font-size: 15px; font-variant-numeric: tabular-nums; }
.decididos { font-size: 12px; color: var(--tinta-3); margin-left: 6px; white-space: nowrap; }
.cab-acciones { display: flex; gap: 6px; align-items: center; }
.menu { position: relative; }
.menu-lista { position: absolute; right: 0; top: 38px; min-width: 240px; background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); box-shadow: var(--sombra); padding: 4px; z-index: 50; }
.menu-lista button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 4px; font-size: 13px; }
.menu-lista button:hover { background: var(--linea-2); }
.menu-lista hr { border: 0; border-top: 1px solid var(--linea); margin: 4px 0; }
.solo-movil { display: none; }

/* ── Aviso superior ── */
.aviso-sup { display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: var(--linea-2); border-bottom: 1px solid var(--linea); font-size: 13px; }

/* ── Vistas ── */
.vista { height: calc(100% - var(--cab)); }
.con-aviso .vista { height: calc(100% - var(--cab) - 45px); }

/* Inicio */
.inicio { overflow: auto; padding: 32px 24px 64px; }
.inicio-rejilla { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; }
.inicio h1 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
.inicio .sub { color: var(--tinta-2); margin: 0 0 20px; max-width: 60ch; }
.area-texto { width: 100%; min-height: 440px; resize: vertical; padding: 20px 22px; border: 1px solid var(--linea); border-radius: var(--radio); background: var(--hoja); font: 17px/1.8 var(--serif); }
.contador { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
.contador .aviso-norm { color: var(--tinta-3); }
.campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.campo > span { font-size: 12px; font-weight: 500; color: var(--tinta-2); }
.campo small { color: var(--tinta-3); font-size: 12px; }
.entrada { height: 34px; padding: 0 10px; border: 1px solid var(--linea); border-radius: var(--radio); background: var(--hoja); }
textarea.entrada { height: auto; padding: 8px 10px; resize: vertical; }
.fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opciones { display: flex; gap: 14px; font-size: 13px; }
.opciones label { display: flex; gap: 6px; align-items: center; }
.lista-evals { max-width: 1120px; margin: 40px auto 0; }
.lista-evals h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--tinta-2); }
.tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabla th { text-align: left; font-weight: 500; color: var(--tinta-3); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--linea); }
.tabla td { padding: 8px; border-bottom: 1px solid var(--linea-2); vertical-align: middle; }
.tabla td.num { font-family: var(--serif); font-size: 16px; font-variant-numeric: tabular-nums; }
.tabla tr.abrible { cursor: pointer; }
.tabla tr.abrible:hover td { background: var(--linea-2); }
.etiqueta { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--linea-2); color: var(--tinta-2); }
.vacio { color: var(--tinta-3); font-size: 13px; padding: 16px 0; }

/* Marcado */
.marcado { display: grid; } /* las columnas las fija el código (aplicarRejilla) */
.col-texto { overflow: auto; position: relative; }
.barra-texto { position: sticky; top: 0; z-index: 20; background: var(--papel); border-bottom: 1px solid var(--linea); }
.herramientas { padding: 8px 20px; font-size: 12px; color: var(--tinta-2); }
.barra-fila { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.herramientas label { display: flex; gap: 5px; align-items: center; }
.herramientas .sep { flex: 1; }
.contadores { display: flex; gap: 10px; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.contadores .mas { color: var(--ok); } .contadores .menos { color: var(--err); }
.btn.activo { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.hoja { max-width: calc(72ch + 64px); margin: 0 auto; padding: 24px 20px 120px 8px; }

/* Paleta: columna fija a la izquierda */
.paleta { border-right: 1px solid var(--linea); background: var(--hoja); overflow: hidden; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pal-cab { display: flex; align-items: center; gap: 2px; padding: 8px 4px 8px 6px; border-bottom: 1px solid var(--linea); flex: none; }
.pestanas-pal { display: flex; gap: 2px; flex: 1; min-width: 0; white-space: nowrap; }
.pestanas-pal button { border: 0; background: none; padding: 4px 6px; font-size: 12px; border-radius: 4px; color: var(--tinta-2); white-space: nowrap; }
.pestanas-pal button:hover { background: var(--linea-2); }
.pestanas-pal button.activa { background: var(--tinta); color: var(--papel); }
.pestanas-pal.compacta button { padding: 4px 4px; font-size: 11px; }
.pestanas-pal.compacta { gap: 0; }
.pal-plegar { flex: none; width: 26px; padding: 0; justify-content: center; }
.pal-cuerpo { overflow: auto; flex: 1; min-height: 0; padding: 12px 12px 48px; }
.pal-sel { border-left: 3px solid var(--tinta-3); padding: 2px 0 2px 10px; margin-bottom: 16px; }
.pal-sel .cita { display: block; font-size: 15px; line-height: 1.45; max-height: 7.4em; overflow: auto; overflow-wrap: break-word; }
.pal-sel small { display: block; margin-top: 4px; color: var(--tinta-3); font-size: 11.5px; }
.pal-instr { font-size: 12.5px; color: var(--tinta-2); margin: 0 0 16px; line-height: 1.5; }
.pal-grupo { margin-bottom: 16px; }
.pal-grupo h4 { font-size: 11.5px; font-weight: 600; color: var(--tinta-2); margin: 0 0 6px; }
.pal-vacio { font-size: 12px; color: var(--tinta-3); margin: 0; line-height: 1.45; }
.pildoras { display: flex; flex-wrap: wrap; gap: 4px; }
.pildora { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 2px 8px; border: 1px solid var(--linea); border-radius: 13px; background: var(--hoja); font-size: 12px; text-align: left; line-height: 1.25; }
.pildora:hover { border-color: var(--f); background: color-mix(in srgb, var(--f) 8%, var(--hoja)); }
.pildora.doc { border-style: dashed; }
.punto-f { width: 8px; height: 8px; border-radius: 50%; background: var(--f); flex: none; }
.pol { font-weight: 600; }
.pol.mas { color: var(--ok); } .pol.menos { color: var(--err); }
kbd, .kbd { font: 500 10.5px var(--ui); color: var(--tinta-3); border: 1px solid var(--linea); border-radius: 3px; padding: 0 4px; line-height: 16px; background: var(--hoja); }
.pal-crit { border-left: 3px solid var(--f); padding-left: 8px; margin: 0 0 14px; }
.pal-crit-nom { color: var(--f); font-weight: 600; font-size: 12px; margin: 0 0 3px 6px; }
.ev-btn { display: flex; width: 100%; align-items: center; gap: 6px; padding: 5px 6px; border: 0; border-radius: 4px; background: none; font-size: 12.5px; text-align: left; line-height: 1.3; }
.ev-btn:hover { background: color-mix(in srgb, var(--f) 10%, var(--hoja)); }
.ev-btn .nom { flex: 1; min-width: 0; }
.ev-btn.doc .nom { color: var(--tinta-2); }
.pal-catalogo.sin-sel .ev-btn { color: var(--tinta-2); }
.pal-plegada { width: 100%; height: 100%; border: 0; background: var(--hoja); display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 14px; color: var(--tinta-2); }
.pal-plegada:hover { background: var(--linea-2); color: var(--tinta); }
.pal-plegada .vertical { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12.5px; font-weight: 500; }

/* Consulta de materiales, sobre el texto */
.consulta { border-top: 1px solid var(--linea); background: var(--hoja); padding: 8px 20px 10px; }
.sub-barra { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.sub-barra .sep { flex: 1; }
.pildora-et { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border: 1px solid var(--linea); border-radius: 13px; background: var(--hoja); font-size: 12px; white-space: nowrap; }
.pildora-et:hover { border-color: var(--c); }
.pildora-et.activa { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--hoja)); font-weight: 500; }
.punto-c { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }
.punto-c.grande { width: 12px; height: 12px; }
.sub-ayuda { font-size: 11.5px; color: var(--tinta-3); margin: 5px 0 4px; }
.doc-pestanas { display: flex; gap: 2px; border-bottom: 1px solid var(--linea); overflow-x: auto; }
.doc-pestanas button { border: 0; background: none; padding: 6px 10px; font-size: 12.5px; border-bottom: 2px solid transparent; white-space: nowrap; color: var(--tinta-2); }
.doc-pestanas button:hover { color: var(--tinta); }
.doc-pestanas button.activa { border-bottom-color: var(--tinta); color: var(--tinta); font-weight: 500; }
.doc-pestanas button.vacia { color: var(--tinta-3); font-style: italic; }
.doc-pestanas .n { font-size: 10.5px; background: var(--linea-2); border-radius: 8px; padding: 0 5px; font-style: normal; }
.doc-vista { max-height: 33vh; overflow: auto; padding: 10px 2px 4px; }
.doc-cuerpo { font: 15px/1.7 var(--serif); white-space: pre-wrap; overflow-wrap: break-word; max-width: 80ch; }
.doc-vista.mono .doc-cuerpo { font: 13px/1.6 ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; white-space: pre; overflow-wrap: normal; tab-size: 8; max-width: none; }
.doc-cuerpo .tab { display: inline-block; overflow: hidden; vertical-align: bottom; }
.cita { font-family: var(--serif); font-style: italic; }
.ds.sub { background: color-mix(in srgb, var(--c) 22%, transparent); box-shadow: inset 0 -2px 0 var(--c); cursor: pointer; }
.ds.sub.elegido { outline: 2px solid var(--c); outline-offset: 1px; border-radius: 2px; }
.ds.sel-doc { background: var(--seleccion); outline: 1px solid var(--tinta-3); }

/* Ventana de etiquetas y editor de pruebas */
.et-fila { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--linea-2); flex-wrap: wrap; }
.et-fila .entrada { flex: 1; min-width: 160px; }
.colores { display: flex; gap: 4px; }
.color { width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--c); padding: 0; }
.color.elegido { box-shadow: 0 0 0 2px var(--hoja), 0 0 0 4px var(--c); }
.et-n { font-size: 11.5px; color: var(--tinta-3); min-width: 52px; text-align: right; }
.et-aviso { flex: 1; font-size: 12.5px; color: var(--err); }
.pr-mono { font-size: 12px; display: flex; gap: 4px; align-items: center; white-space: nowrap; color: var(--tinta-2); }
.doc-ed textarea.mono { font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; overflow-x: auto; tab-size: 8; }

/* Texto del estudiante */
.parr { display: grid; grid-template-columns: 52px minmax(0, 1fr); margin-bottom: 1.1em; }
.margen { display: flex; justify-content: flex-end; align-items: stretch; gap: 3px; padding-right: 10px; position: relative; }
.asa { align-self: flex-start; width: 22px; height: 22px; margin-top: 4px; border: 0; background: none; color: var(--tinta-3); font-family: var(--serif); font-size: 15px; border-radius: 4px; opacity: .35; }
.parr:hover .asa, .asa:focus-visible { opacity: 1; }
.asa:hover { background: var(--linea-2); color: var(--tinta); }
.barra-m { width: 5px; border: 0; padding: 0; border-radius: 3px; background: var(--f); position: relative; }
.barra-m.error { background: repeating-linear-gradient(to bottom, var(--f) 0 6px, transparent 6px 10px); }
.barra-m .num { position: absolute; top: -2px; right: 7px; }
.ptexto { margin: 0; font: 17px/1.8 var(--serif); max-width: 72ch; white-space: pre-wrap; overflow-wrap: break-word; }
.ptexto .s { border-radius: 2px; }
.s.acierto { background: color-mix(in srgb, var(--fa) 20%, transparent); }
.s.error { text-decoration: underline wavy var(--f); text-decoration-thickness: 1.4px; text-underline-offset: 4px; text-decoration-skip-ink: none; }
.s.error.grave { text-decoration-thickness: 2.4px; }
.s.error2 { box-shadow: inset 0 -2px 0 var(--f2); }
.s.seleccion { background: var(--seleccion); outline: 1px solid var(--tinta-3); }
.s.prop { outline: 1.5px dotted var(--coh); outline-offset: 1px; cursor: pointer; }
.s.destello { animation: destello 1.2s ease-out; }
@keyframes destello { 0%, 30% { background: color-mix(in srgb, var(--f, var(--tinta-3)) 45%, transparent); } }
.punto { color: var(--f); font-family: var(--ui); font-weight: 700; cursor: pointer; }
.punto::before { content: attr(data-c); }
.num { font: 600 9.5px/1 var(--ui); color: var(--f); vertical-align: super; margin-left: 1px; cursor: pointer; user-select: none; -webkit-user-select: none; }
.num::after { content: attr(data-n); }
.sin-numeros .num { display: none; }
.sin-marcas .s.acierto { background: none; }
.sin-marcas .s.error, .sin-marcas .s.error2 { text-decoration: none; box-shadow: none; }
.sin-marcas .punto, .sin-marcas .barra-m, .sin-marcas .num { visibility: hidden; }
.leyenda { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--tinta-2); padding: 0 0 4px 52px; }
.ley-grupo { display: inline-flex; gap: 4px 10px; flex-wrap: wrap; }
.ley-grupo span { display: inline-flex; align-items: center; gap: 4px; }
.leyenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.leyenda-nota { font-size: 11.5px; color: var(--tinta-3); padding: 0 0 18px 52px; }
.muestra { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--k); margin-right: 6px; vertical-align: -1px; flex: none; }
.t-cab .muestra { margin-top: 4px; }

/* Panel de rúbrica */
.panel { border-left: 1px solid var(--linea); background: var(--hoja); overflow: auto; }
.panel-cab { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--hoja); border-bottom: 1px solid var(--linea); }
.panel-cab b { font-size: 13px; font-weight: 600; }
.desc { border-bottom: 1px solid var(--linea); }
.desc-cab { display: flex; gap: 10px; align-items: baseline; padding: 14px 14px 8px; border-left: 3px solid var(--f); }
.desc-cab .n { flex: 1; font-size: 12.5px; font-weight: 600; }
.desc-cab .n small { display: block; font-weight: 400; color: var(--tinta-3); font-size: 11.5px; }
.desc-cab .st { font-family: var(--serif); font-size: 15px; font-variant-numeric: tabular-nums; color: var(--tinta-2); white-space: nowrap; }
.tarjeta { padding: 10px 14px 12px 17px; border-top: 1px solid var(--linea-2); font-size: 12.5px; }
.tarjeta.enfocada { background: color-mix(in srgb, var(--f) 5%, var(--hoja)); }
.t-cab { display: flex; gap: 8px; align-items: flex-start; }
.t-nombre { flex: 1; font-weight: 500; font-size: 13px; line-height: 1.35; }
.t-conteo { font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.t-conteo .mas { color: var(--ok); } .t-conteo .menos { color: var(--err); margin-left: 6px; }
.t-sug { margin: 6px 0 8px; color: var(--tinta-2); line-height: 1.4; }
.t-sug b { font-weight: 600; color: var(--tinta); }
.t-sug.falta { color: var(--tinta-3); font-style: italic; }
.t-niveles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.nv { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 5px 2px; border: 1px solid var(--linea); border-radius: var(--radio); background: var(--hoja); font-size: 11.5px; line-height: 1.25; }
.nv .p { font-family: var(--serif); font-size: 13px; color: var(--tinta-3); font-variant-numeric: tabular-nums; }
.nv:hover { border-color: var(--tinta-3); }
.nv.sugerido { border-style: dashed; border-color: var(--f); }
.nv.elegido { background: var(--f); border-color: var(--f); color: #fff; }
.nv.elegido .p { color: rgba(255, 255, 255, .85); }

.aviso { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--tinta); color: var(--papel); padding: 9px 14px; border-radius: var(--radio); font-size: 13px; z-index: 80; box-shadow: var(--sombra); max-width: calc(100% - 32px); }

#impresion { display: none; }

/* ── Móvil ── */
@media (max-width: 860px) {

  .herramientas { padding: 8px 12px; }
  .consulta { padding: 8px 12px; }
  .doc-vista { max-height: 30vh; }
  .nv { padding: 8px 2px; font-size: 12px; }

/* ── Impresión ── */
@media print {

  // Por defecto: los pesos del CSV y la proporción 1 / 0,66 / 0,33 / 0. Los valores por nivel se derivan,

  function ponderacionPorDefecto() { return { pesos: JSON.parse(JSON.stringify(PESOS_DEF)), proporciones: { avanzado: PROPORCIONES_DEF.avanzado, intermedio: PROPORCIONES_DEF.intermedio } }; }
  function r2(x) { return Math.round(x * 100 + 1e-9) / 100; }
  function valoresDe(peso, prop) {
    return { experto: r2(peso), avanzado: r2(peso * prop.avanzado), intermedio: r2(peso * prop.intermedio), inicial: 0 };
  }
  function normalizarPonderacion(p) {
    var d = ponderacionPorDefecto();
    p = p || {};
    RUBRICA.forEach(function (c) {
      var v = p.pesos && Number(p.pesos[c.id]);
      if (isFinite(v) && v >= 0) d.pesos[c.id] = r2(v);
    });
    ['avanzado', 'intermedio'].forEach(function (n) {
      var v = p.proporciones && Number(p.proporciones[n]);
      if (isFinite(v) && v >= 0 && v <= 1) d.proporciones[n] = v;
    });
    return d;
  }

  function migrarPrueba(m) {
    if (!m) return m;
    if (!m.documentos) {
      m.documentos = (m.docs || []).map(function (d) {
        var o = { id: nuevoId('doc'), nom: d.nombre || d.nom || 'Documento', texto: d.texto || '' };
        if (/tabla|cifras|datos/i.test(o.nom)) o.mono = true;

    if (!m.subrayados) m.subrayados = [];

  // Añade un subrayado. Absorbe (elimina) los del mismo documento que queden completamente dentro.

  function agregarSubrayado(prueba, documento, inicio, fin, etiqueta) {
    if (fin < inicio) { var x = inicio; inicio = fin; fin = x; }
    if (fin === inicio) return null;
    var absorbidos = prueba.subrayados.filter(function (s) { return s.documento === documento && s.inicio >= inicio && s.fin <= fin; });
    prueba.subrayados = prueba.subrayados.filter(function (s) { return absorbidos.indexOf(s) === -1; });
    var nuevo = { id: nuevoId('sb'), documento: documento, inicio: inicio, fin: fin, etiqueta: etiqueta };
    prueba.subrayados.push(nuevo);
    return { subrayado: nuevo, absorbidos: absorbidos.length };
  }

  // para que las columnas queden alineadas. Devuelve { posición: ancho }. El texto no se modifica.
  function anchosTabulacion(texto) {
    var lineas = String(texto || '').split('\n');
    var anchos = [];
    lineas.forEach(function (l) {
      var celdas = l.split('\t');
      celdas.slice(0, -1).forEach(function (c, k) { anchos[k] = Math.max(anchos[k] || 0, c.length); });
    });
    var mapa = {}, pos = 0;
    lineas.forEach(function (l) {
      var celdas = l.split('\t');
      celdas.forEach(function (c, k) {
        pos += c.length;
        if (k < celdas.length - 1) { mapa[pos] = anchos[k] - c.length + 3; pos += 1; }
      });
      pos += 1;
    });
    return mapa;
  }

  // ───────────────────────── Utilidades de texto ─────────────────────────
  var RE_LETRA = /[\p{L}\p{N}]/u;
  function esLetra(ch) { return !!ch && RE_LETRA.test(ch); }

  function contarPalabras(texto) {
    if (!texto) return 0;
    var n = 0;
    texto.split(/\s+/).forEach(function (t) { if (t && RE_LETRA.test(t)) n++; });
    return n;
  }

  function percentil(arr, p) {
    if (!arr.length) return 0;
    var a = arr.slice().sort(function (x, y) { return x - y; });
    var i = Math.min(a.length - 1, Math.max(0, Math.round((a.length - 1) * p)));
    return a[i];
  }

  // Une líneas cortadas por un PDF. Devuelve { texto, unidas, guiones, duro }.
  function normalizarTexto(bruto) {
    var t = String(bruto || '').replace(/\r\n?/g, '\n').replace(/\u00A0/g, ' ').replace(/[ \t]+/g, ' ');
    var lineas = t.split('\n').map(function (l) { return l.trim(); });
    var llenas = lineas.filter(function (l) { return l.length > 0; });
    var largos = llenas.map(function (l) { return l.length; });
    var med = percentil(largos, 0.5);
    var ancho = percentil(largos, 0.75);
    var maximo = percentil(largos, 0.95);
    var cerca = largos.filter(function (n) { return Math.abs(n - ancho) <= ancho * 0.25; }).length;
    // ¿Parece un bloque con saltos duros? Muchas líneas de ancho parecido y corto.
    var duro = llenas.length >= 6 && med > 0 && ancho <= 130 && cerca >= llenas.length * 0.5;
    var parrafos = [];
    var actual = '';
    var unidas = 0, guiones = 0;
    function cerrar() { if (actual.trim()) parrafos.push(actual.trim()); actual = ''; }
    for (var i = 0; i < lineas.length; i++) {
      var l = lineas[i];
      if (!l) { cerrar(); continue; }
      if (!duro) { actual = l; cerrar(); continue; }
      if (actual) {
        var m = /(\p{L})-$/u.exec(actual);
        if (m && /^\p{Ll}/u.test(l)) { actual = actual.slice(0, -1) + l; guiones++; }
        else if (m) { actual = actual + l; guiones++; }
        else actual = actual + ' ' + l;
        unidas++;
      } else actual = l;
      var finFrase = /[.!?…:»"”)]$/.test(l);
      // Cierra el párrafo si la línea es corta o si la primera palabra de la siguiente habría cabido en ella:
      // un salto que no obligaba el ancho es un salto de párrafo.
      var sig = lineas[i + 1] || '';
      var primera = sig.split(' ')[0] || '';
      var cabia = sig && l.length + 1 + primera.length <= maximo;
      if (finFrase && (l.length < ancho * 0.85 || cabia)) cerrar();
    }
    cerrar();
    return { texto: parrafos.join('\n'), unidas: unidas, guiones: guiones, duro: duro };
  }

  function calcularParrafos(texto) {
    var res = [];
    var ini = 0;
    for (var i = 0; i <= texto.length; i++) {
      if (i === texto.length || texto[i] === '\n') {
        if (i > ini) res.push({ inicio: ini, fin: i });
        ini = i + 1;
      }
    }
    return res;
  }

  function parrafoDe(parrafos, pos) {
    for (var i = 0; i < parrafos.length; i++) {
      if (pos >= parrafos[i].inicio && pos <= parrafos[i].fin) return i;
    }
    return parrafos.length ? parrafos.length - 1 : 0;
  }

  // Ajusta una selección a palabras completas sin salir del párrafo.
  function ajustarAPalabras(texto, inicio, fin) {
    if (fin < inicio) { var x = inicio; inicio = fin; fin = x; }
    while (inicio < fin && /\s/.test(texto[inicio])) inicio++;
    while (fin > inicio && /\s/.test(texto[fin - 1])) fin--;
    if (inicio === fin) return { inicio: inicio, fin: fin };
    while (inicio > 0 && esLetra(texto[inicio - 1]) && esLetra(texto[inicio])) inicio--;
    while (fin < texto.length && esLetra(texto[fin]) && esLetra(texto[fin - 1])) fin++;
    return { inicio: inicio, fin: fin };
  }

  function palabraEn(texto, pos) {
    var i = pos, f = pos;
    if (!esLetra(texto[pos])) {
      if (esLetra(texto[pos - 1])) { i = pos - 1; f = pos - 1; } else return null;
    }
    while (i > 0 && esLetra(texto[i - 1])) i--;
    while (f < texto.length && esLetra(texto[f])) f++;
    if (f === i) f = i + 1;
    return { inicio: i, fin: f };
  }

  function tipoSeleccion(texto, parrafos, inicio, fin) {
    if (inicio === fin) return 'hueco';
    var frag = texto.slice(inicio, fin);
    var p = parrafos[parrafoDe(parrafos, inicio)];
    if (p && inicio <= p.inicio && fin >= p.fin) return 'parrafo';
    if (!RE_LETRA.test(frag) && frag.trim().length <= 3) return 'signo';
    if (!/\s/.test(frag.trim())) return 'palabra';
    return 'frase';

  function sinTildes(s) {

  }

  // ───────────────────────── Conteos sobre una evaluación ─────────────────────────
  function marcasDe(ev, cid) {

  // ───────────────────────── Reglas de sugerencia ─────────────────────────

      if (exp.some(function (m) { return m.parrafo === 0; })) return { nivel: 'experto', razon: 'Postura explícita en el párrafo introductorio.' };

      var ins = contar(ev, 'c2.razonInsumo'), sin = contar(ev, 'c2.razon');
      var enu = contar(ev, 'c2.enunciada'), rel = contar(ev, 'c2.relacion'), imp = contar(ev, 'c2.impertinente');
      var des = ins + sin;
      if (!des && !enu && !rel && !imp) return { nivel: null, razon: 'Marca las razones que sostienen la postura.' };
      if (!des && !enu && !rel && imp) return { nivel: 'inicial', razon: 'Solo hay razones no pertinentes (' + imp + ').' };
      if (!des) return { nivel: 'intermedio', razon: 'Hay razones pertinentes, pero ninguna desarrollada' + (rel ? '; en ' + plural(rel, 'caso', 'casos') + ' no se ve cómo conduce a la postura.' : '.') };
      if (rel >= u.c2_relacion_inter) return { nivel: 'intermedio', razon: plural(des, 'razón desarrollada', 'razones desarrolladas') + ', pero en ' + plural(rel, 'caso', 'casos') + ' no se ve cómo conduce a la postura.' };
      if (ins) {
        var usados = insumosUsados(ev);
        return { nivel: 'experto', razon: plural(ins, 'razón desarrollada', 'razones desarrolladas') + ' con uso explícito de insumos' + (usados.length ? ' (' + usados.join(', ') + ')' : '') + '.' };

    },
    c3: function (ev, u) {
      if (tieneGeneral(ev, 'c3.noasume')) return { nivel: 'inicial', razon: 'Registraste que no asume el rol asignado.' };
      var voz = contar(ev, 'c3.voz'), des = contar(ev, 'c3.destinatario');
      var cam = contar(ev, 'c3.cambio'), ton = contar(ev, 'c3.tono');
      var sinDest = tieneGeneral(ev, 'c3.sindestinatario');
      if (!voz && !des && !cam && !ton && !sinDest) return { nivel: null, razon: 'Marca la voz del rol y la interpelación a quien decide.' };
      if (!voz && !des && ton >= u.c3_tono_inter) return { nivel: 'inicial', razon: 'No hay marcas del rol y el tono o registro no corresponde (' + ton + ').' };
      if (sinDest || !des) return { nivel: 'intermedio', razon: 'Asume el rol, pero no se dirige a quien debe decidir' + (sinDest ? ' (registrado).' : ': no hay interpelación marcada.') };

    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return 'calificacion-n2-historial-' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '.html';
  }
  function guardarHistorial() {
    if (S.cifradoEmbebido && !S.desbloqueado) {
      ventana('Primero desbloquea el historial', '<p>Esta página ya trae un historial cifrado. Si guardas sin desbloquearlo, la copia nueva lo reemplazaría y perderías lo publicado.</p><p class="nota alerta">Si olvidaste la contraseña, puedes empezar un historial nuevo. Las evaluaciones del historial cifrado actual no pasarán a la copia nueva.</p>',
        '<button class="btn peligro" data-a="empezarDeCero">Empezar un historial nuevo</button><span style="flex:1"></span><button class="btn primario" data-a="desbloquear">Desbloquear</button>');
      return;
    }
    var bloqueadas = [];
    S.datos.evaluaciones.filter(function (e) { return e.visibilidad === 'publica'; }).forEach(function (e) {
      var h = N.contieneNombre(e);
      if (h.length) bloqueadas.push({ e: e, donde: h });
    });
    if (bloqueadas.length) {
      ventana('El nombre de un estudiante aparece en una evaluación pública', '<p>No se puede publicar mientras el nombre aparezca en lo que ve cualquiera:</p><ul>' + bloqueadas.map(function (b) { return '<li><b>' + esc(b.e.etiquetaPublica || 'Sin etiqueta') + '</b>: en ' + esc(b.donde.join(', ')) + '</li>'; }).join('') + '</ul><p>Quita el nombre o cambia esas evaluaciones a privadas.</p>', '<button class="btn primario" data-a="cerrarVentana">Entendido</button>');
      return;
    }
    if (!S.clave) { pedirClaveNueva(); return; }
    descargarHistorial();
  }
  function pedirClaveNueva() {
    var h = '<p>Todo el historial se cifra con esta contraseña antes de salir de tu navegador. La capa pública (solo las evaluaciones marcadas como públicas, sin nombres ni materiales) queda legible para cualquiera.</p>';
    h += '<label class="campo"><span>Contraseña</span><input class="entrada" type="password" id="clave1" autocomplete="new-password"><small>Una frase de cuatro o más palabras. Protege un archivo que será público.</small></label>';
    h += '<label class="campo"><span>Repítela</span><input class="entrada" type="password" id="clave2" autocomplete="new-password"></label>';
    h += '<p class="nota">No hay forma de recuperarla. Guárdala en un gestor de contraseñas.</p>';
    ventana('Contraseña del historial', h, '<button class="btn" data-a="cerrarVentana">Cancelar</button><button class="btn primario" data-a="fijarClave">Cifrar y descargar</button>');
  }
  function fijarClave() {
    var a = $('clave1').value, b = $('clave2').value;
    if (a.length < 12 || a.trim().split(/\s+/).length < 2) { U.aviso('Usa una frase de al menos 12 caracteres y varias palabras.'); return; }
    if (a !== b) { U.aviso('Las dos contraseñas no coinciden.'); return; }
    S.clave = a; S.desbloqueado = true;
    descargarHistorial();
  }
  function construirHistorial(datos, clave) {
    // Capa pública: solo evaluaciones marcadas como públicas, sin nombres ni pruebas, y la ponderación para que sus totales cuadren.
    // Las etiquetas, las pruebas y sus subrayados viajan solo en la capa cifrada.
    var publico = { evaluaciones: datos.evaluaciones.filter(function (e) { return e.visibilidad === 'publica'; }).map(N.capaPublica) };
    if (datos.ponderacion) publico.ponderacion = datos.ponderacion;
    return N.cifrar({ evaluaciones: datos.evaluaciones, materiales: datos.materiales, etiquetas: datos.etiquetas, borradas: datos.borradas, umbrales: datos.umbrales, ponderacion: datos.ponderacion }, clave).then(function (pkg) {
      // Las etiquetas se arman por partes para que su texto literal solo exista una vez en la página.
      function bloque(html, nombre, valor) {
        var abre = '<' + 'script type="application/json" id="n2-' + nombre + '">', cierra = '<' + '/script>';
        var i = html.indexOf(abre), j = html.indexOf(cierra, i);
        if (i === -1 || j === -1) throw new Error('Plantilla sin bloque ' + nombre);
        return html.slice(0, i + abre.length) + N.jsonIncrustable(valor) + html.slice(j);
      }
      return bloque(bloque(U.PLANTILLA, 'publico', publico), 'cifrado', pkg);
    });
  }
  function descargarHistorial() {
    cerrarVentana();
    U.aviso('Cifrando el historial…');
    construirHistorial(S.datos, S.clave).then(function (html) {
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nombreArchivo();
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      var pub = S.datos.evaluaciones.filter(function (e) { return e.visibilidad === 'publica'; }).length;
      ventana('Historial descargado', '<p>El archivo trae ' + (S.datos.evaluaciones.length === 1 ? '1 evaluación cifrada' : S.datos.evaluaciones.length + ' evaluaciones cifradas') + ', ' + S.datos.materiales.length + (S.datos.materiales.length === 1 ? ' prueba' : ' pruebas') + ' con sus subrayados y ' + (pub === 1 ? '1 evaluación pública' : pub + ' evaluaciones públicas') + '.</p><p>Para publicarlo, renómbralo a <b>index.html</b> y súbelo a tu repositorio en lugar del anterior.</p><div class="nota"><p style="margin:0 0 6px">Antes de publicar, ten en cuenta:</p><ul style="margin:0;padding-left:18px"><li>Un repositorio guarda la historia de cada archivo. Lo que publiques quedará ahí aunque después lo borres.</li><li>La contraseña protege un archivo público: cualquiera puede descargarlo e intentar abrirlo.</li><li>Pide autorización a los estudiantes cuyos textos publiques como ejemplo.</li></ul></div>', '<button class="btn primario" data-a="cerrarVentana">Entendido</button>');
    }).catch(function () { U.aviso('No se pudo cifrar el historial en este navegador.'); });
  }
  function desbloquear() {
    if (!S.cifradoEmbebido) { U.aviso('Esta página no trae un historial cifrado.'); return; }
    ventana('Desbloquear historial', '<label class="campo"><span>Contraseña del historial</span><input class="entrada" type="password" id="claveAbrir" autocomplete="current-password"></label><p class="nota">Las evaluaciones cifradas se fusionan con las de este navegador; de cada una queda la versión más reciente.</p>', '<button class="btn" data-a="cerrarVentana">Cancelar</button><button class="btn primario" data-a="abrirCifrado">Desbloquear</button>');
  }
  function abrirCifrado() {
    var clave = $('claveAbrir').value;
    var btn = document.querySelector('[data-a="abrirCifrado"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Abriendo…'; }
    N.descifrar(S.cifradoEmbebido, clave).then(function (d) {
      S.datos = N.fusionar(d, S.datos);
      S.clave = clave; S.desbloqueado = true;
      U.migrar();
      U.guardar(); cerrarVentana(); U.renderAvisoSup(); U.renderCabecera();
      if (!S.ev) U.renderInicio(); else U.abrirEval(S.ev.id);
      U.aviso('Historial desbloqueado: ' + (S.datos.evaluaciones.length === 1 ? '1 evaluación.' : S.datos.evaluaciones.length + ' evaluaciones.'));
    }).catch(function () {
      if (btn) { btn.disabled = false; btn.textContent = 'Desbloquear'; }
      U.aviso('Esa contraseña no abre este historial.');
    });
  }
  function empezarDeCero() {
    confirmar('Empezar un historial nuevo', 'La copia que descargues no incluirá las evaluaciones del historial cifrado que trae esta página. Las de este navegador sí se conservan.', 'Empezar de nuevo', function () {
      S.cifradoEmbebido = null; S.desbloqueado = true; S.clave = null;
      U.renderAvisoSup(); U.renderCabecera();
      pedirClaveNueva();
    }, true);
  }

  // ───────── Impresión ─────────
  function corto(t) { t = t.trim(); return t.length > 140 ? t.slice(0, 70).trim() + ' … ' + t.slice(-50).trim() : t; }
  function imprimir() {
    var ev = S.ev;
    if (!ev) return;
    var t = N.calcularTotal(ev), nums = U.numerar(ev), mat = U.material(ev.materialId);
    var h = '<div class="imp"><h1>Retroalimentación de escritura, nivel 2</h1>';
    h += '<div class="meta">' + esc(ev.estudiante || ev.etiquetaPublica || '') + (mat ? '&emsp;' + esc(mat.titulo) : '') + '&emsp;' + U.fecha(ev.modificada) + '&emsp;' + ev.palabras + ' palabras</div>';
    h += '<div><span class="tot">' + N.fmt2(t.total) + '</span> <span style="color:#666">de ' + N.fmt2(N.puntajeMaximo()) + '</span>' + (t.decididos < t.criterios ? '&emsp;<span class="nota-imp">' + t.decididos + ' de ' + t.criterios + ' criterios decididos</span>' : '') + '</div>';
    h += '<h2>Resultado por criterio</h2><table class="tabla-res"><thead><tr><th>Criterio</th><th>Nivel</th><th>Puntaje</th><th>Descripción del nivel</th></tr></thead><tbody>';
    N.DESCRIPTORES.forEach(function (d) {
      var st = t.subtotales[d.id];
      h += '<tr class="grupo f-' + d.familia + '"><td colspan="2">' + esc(d.nombre) + '</td><td class="pts">' + N.fmt2(st.obtenido) + ' / ' + N.fmt2(st.maximo) + '</td><td></td></tr>';
      N.RUBRICA.filter(function (c) { return c.d === d.id; }).forEach(function (c) {
        var dec = ev.decisiones[c.id], n = dec && dec.nivel;
        h += '<tr><td>' + esc(c.nombre) + '</td><td>' + (n ? N.NOMBRE_NIVEL[n] : 'Sin decidir') + '</td><td class="pts">' + (n ? N.fmt2(c.valores[n]) : '—') + ' / ' + N.fmt2(c.valores.experto) + '</td><td>' + (n ? esc(c.niveles[n]) : '') + '</td></tr>';
      });
    });
    h += '</tbody></table>';
    h += '<h2>Tu texto, con las observaciones numeradas</h2><div class="texto-imp">' + U.htmlTexto(ev, { imprimir: true }) + '</div>';
    var hayEv = false, bloque = '';
    N.RUBRICA.forEach(function (c) {
      var ms = N.marcasDe(ev, c.id).slice().sort(function (a, b) { return nums[a.id] - nums[b.id]; });
      var gs = N.generalesDe(ev, c.id);
      if (!ms.length && !gs.length) return;
      hayEv = true;
      bloque += '<h3 style="font-size:10.5pt;margin:10pt 0 3pt">' + esc(c.corto) + '</h3><ul class="ev-imp" style="--f:' + N.colorCriterio(c.id) + '">';
      ms.forEach(function (m) {
        var e = EV[m.evidencia], ex = [];
        if (e.grav && m.gravedad) ex.push(N.GRAVEDADES[e.grav][m.gravedad].toLowerCase());
        if (m.insumo) ex.push(m.insumo);
        if (m.funcion) ex.push('función: ' + m.funcion);
        bloque += '<li><span class="n">' + nums[m.id] + '</span>' + (e.pol === '+' ? '✓ ' : '✕ ') + esc(e.nombre) + (ex.length ? ' (' + esc(ex.join(', ')) + ')' : '') + ': <i class="cita">«' + esc(corto(N.fragmento(ev, m))) + '»</i>' + (m.comentario ? '. ' + esc(m.comentario) : '') + '</li>';
      });
      gs.forEach(function (g) { bloque += '<li><span class="n">—</span>✕ ' + esc(EV[g.evidencia].nombre) + (g.comentario ? '. ' + esc(g.comentario) : '') + '</li>'; });
      bloque += '</ul>';
    });
    if (hayEv) h += '<h2>Evidencias por criterio</h2>' + bloque;
    var recs = N.recomendaciones(ev).filter(function (r) { return ev.recExcluidas.indexOf(r.c) === -1; });
    if (recs.length) {
      h += '<h2>Lo que más subiría tu puntaje</h2><ul class="rec-imp">' + recs.slice(0, 3).map(function (r) { return '<li>' + esc(r.texto) + '</li>'; }).join('') + '</ul>';
      if (recs.length > 3) h += '<h2>Otros aspectos para revisar</h2><ul class="rec-imp">' + recs.slice(3).map(function (r) { return '<li>' + esc(r.texto) + '</li>'; }).join('') + '</ul>';
    }
    if (ev.observaciones && ev.observaciones.trim()) h += '<h2>Observaciones del evaluador</h2><p style="white-space:pre-wrap">' + esc(ev.observaciones) + '</p>';
    h += '</div>';
    $('impresion').innerHTML = h;
    var titulo = document.title;
    document.title = 'Retroalimentación ' + (ev.estudiante || ev.etiquetaPublica || 'escritura n2');
    setTimeout(function () { window.print(); document.title = titulo; }, 60);
  }

  // ───────── Eventos ─────────
  function accion(a, el, e) {
    var id = el.getAttribute('data-id');
    switch (a) {
      case 'menu': S.menu = !S.menu; U.renderCabecera(); return;
      case 'nueva': S.menu = false; U.irInicio(); setTimeout(function () { var t = $('entradaTexto'); if (t) t.focus(); }, 30); return;
      case 'inicio': S.menu = false; U.irInicio(); return;
      case 'imprimir': S.menu = false; U.renderCabecera(); imprimir(); return;
      case 'pruebas': S.menu = false; U.renderCabecera(); verPruebas(); return;
      case 'nuevaPrueba': editorPrueba(null); return;
      case 'editarPrueba': editorPrueba(id); return;
      case 'guardarPrueba': guardarPrueba(id); return;
      case 'agregarDoc': $('prDocs').insertAdjacentHTML('beforeend', docEd({ id: N.nuevoId('doc'), nom: '', texto: '' })); var ns = document.querySelectorAll('#prDocs .pr-nombre'); ns[ns.length - 1].focus(); return;
      case 'quitarDoc': el.closest('.doc-ed').remove(); return;
      case 'consulta':
        S.menu = false;
        if (!U.material(S.ev && S.ev.materialId)) { U.aviso('Esta evaluación no tiene una prueba asociada.'); return; }
        S.consulta.abierta = !S.consulta.abierta; S.consulta.sel = null; S.consulta.sub = null;
        U.renderCabecera(); U.renderHerramientas(); U.renderConsulta(); return;
      case 'docPestana': S.consulta.doc = id; S.consulta.sel = null; S.consulta.sub = null; U.renderConsulta(); return;
      case 'consultarPrueba': U.verPruebaLectura(id); return;
      case 'verPruebaDoc': U.verPruebaLectura($('docVistaLectura').getAttribute('data-prueba'), id); return;
      case 'verImagen': U.verImagen(el.getAttribute('data-src-doc'), el.getAttribute('data-img')); return;
      case 'cerrarVisor': U.cerrarVisor(); return;
      case 'quitarImg':
        imgsBorrador[el.getAttribute('data-doc')] = (imgsBorrador[el.getAttribute('data-doc')] || []).filter(function (x) { return x.id !== el.getAttribute('data-img'); });
        $('mini-' + el.getAttribute('data-doc')).innerHTML = htmlMiniaturas(el.getAttribute('data-doc')); return;
      case 'ponderacion': S.menu = false; U.renderCabecera(); verPonderacion(); return;
      case 'restablecerPonderacion':
        var def = N.ponderacionPorDefecto();
        document.querySelectorAll('[data-peso]').forEach(function (i) { i.value = N.fmt2(def.pesos[i.getAttribute('data-peso')]); });
        document.querySelectorAll('[data-prop]').forEach(function (i) { i.value = N.fmt2(def.proporciones[i.getAttribute('data-prop')]); });
        recalcularPonderacion(); return;
      case 'guardarPonderacion': guardarPonderacion(); return;
      case 'etiquetar': U.etiquetar(el.getAttribute('data-et')); return;
      case 'quitarSub': U.quitarSub(); return;
      case 'etiquetas': U.verEtiquetas(); return;
      case 'etColor': case 'etNueva': case 'etEliminar': case 'etEliminarYa': U.accionEtiqueta(a, el); return;
      case 'etCancelar': U.verEtiquetas(); return;
      case 'pestanaPal': S.pestana = el.getAttribute('data-t'); U.renderPaleta(); var pc = $('palCuerpo'); if (pc) pc.querySelector('.pal-catalogo').scrollIntoView({ block: 'start' }); return;
      case 'plegarPaleta':
        if (U.esMovil()) { S.paletaMovil = false; S.sel = null; U.renderTexto(); U.renderPaleta(); return; }
        S.paletaPlegada = !S.paletaPlegada; U.guardarPref(); U.aplicarRejilla(); U.renderPaleta(); return;
      case 'abrirPaletaMovil': S.paletaMovil = true; U.renderPaleta(); return;
      case 'umbrales': S.menu = false; U.renderCabecera(); verUmbrales(); return;
      case 'restablecerUmbrales': document.querySelectorAll('[data-umbral]').forEach(function (i) { i.value = N.umbralesPorDefecto()[i.getAttribute('data-umbral')]; }); return;
      case 'guardarUmbrales': guardarUmbrales(); return;
      case 'guardarHistorial': S.menu = false; U.renderCabecera(); guardarHistorial(); return;
      case 'fijarClave': fijarClave(); return;
      case 'desbloquear': S.menu = false; U.renderCabecera(); desbloquear(); return;
      case 'abrirCifrado': abrirCifrado(); return;
      case 'empezarDeCero': empezarDeCero(); return;
      case 'cerrarVentana': cerrarVentana(); return;
      case 'empezar': U.empezar(); return;
      case 'abrir': if (e.target.closest('[data-a="borrarEval"]')) return; U.abrirEval(id); return;
      case 'borrarEval':
        confirmar('Borrar evaluación', 'La evaluación desaparece de este navegador y no volverá a aparecer al fusionar historiales.', 'Borrar', function () {
          S.datos.evaluaciones = S.datos.evaluaciones.filter(function (x) { return x.id !== id; });
          if (S.datos.borradas.indexOf(id) === -1) S.datos.borradas.push(id);
          U.guardar(); U.renderInicio();
        }, true);
        return;
      case 'parrafo': U.seleccionarParrafo(+el.getAttribute('data-p')); return;
      case 'cancelarSel': U.limpiarSeleccion(); return;
      case 'marcar': U.crearMarca(el.getAttribute('data-ev'), e.shiftKey); return;
      case 'borrarMarca': U.borrarMarca(id); return;
      case 'cerrarEditor': U.cerrarEditor(); U.renderTexto(); return;
      case 'deshacer': U.deshacer(); return;
      case 'soloFuera': S.solo = null; U.renderMarcado(); return;
      case 'nivel': U.decidir(el.getAttribute('data-c'), el.getAttribute('data-n')); return;
      case 'general': U.registrarGeneral(el.getAttribute('data-ev')); return;
      case 'quitarGeneral': U.quitarGeneral(id); return;
      case 'irMarca': U.irAMarca(id); return;
      case 'irCrit': U.irCrit(el.getAttribute('data-c')); return;
      case 'colapsar': S.colapsado = !S.colapsado; U.guardarPref(); U.renderMarcado(); return;

  document.addEventListener('click', function (e) {
    // Un toque que abre la paleta genera después un clic en el mismo punto; si cae sobre la paleta recién abierta, se ignora.
    if (S.tragarClic && Date.now() < S.tragarClic && e.target.closest('#paleta, #editorMarca')) { e.preventDefault(); e.stopPropagation(); S.tragarClic = 0; return; }
    var el = e.target.closest('[data-a]');
    if (S.menu && !e.target.closest('.menu')) { S.menu = false; U.renderCabecera(); }
    if (el && !el.closest('#texto')) { accion(el.getAttribute('data-a'), el, e); return; }
    if (S.abierta && !e.target.closest('#editorMarca, #texto')) { U.cerrarEditor(); U.renderTexto(); }
  });
  $('fab').addEventListener('click', function () { $('panel').classList.add('abierto-movil'); U.renderPanel(); });

  var texto = $('texto');
  texto.addEventListener('pointerdown', function (e) { S.ptr = { tipo: e.pointerType, x: e.clientX, y: e.clientY }; });
  texto.addEventListener('pointerup', function (e) {
    if (e.button === 2) return;
    var asa = e.target.closest('.asa');
    if (e.pointerType !== 'mouse') S.tragarClic = Date.now() + 600;
    if (asa) { e.preventDefault(); U.seleccionarParrafo(+asa.getAttribute('data-p')); return; }
    setTimeout(function () { U.alSoltar(e); }, 0);
  });
  texto.addEventListener('contextmenu', function (e) {
    var p = e.target.closest('.s.prop');
    if (p) { e.preventDefault(); U.descartarPropuesta(p.getAttribute('data-prop')); }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'entradaTexto') { S.borrador.texto = t.value; U.renderContador(); return; }
    if (t.id === 'entEstudiante') { S.borrador.estudiante = t.value; return; }
    if (t.id === 'entEtiqueta') { S.borrador.etiqueta = t.value; return; }
    if (t.hasAttribute && t.hasAttribute('data-et-nom')) { U.renombrarEtiqueta(t.getAttribute('data-et-nom'), t.value); return; }
    if (t.hasAttribute && (t.hasAttribute('data-peso') || t.hasAttribute('data-prop'))) { recalcularPonderacion(); return; }
    if (t.classList && t.classList.contains('img-nom')) { var im = (imgsBorrador[t.getAttribute('data-doc')] || []).find(function (x) { return x.id === t.getAttribute('data-img'); }); if (im) im.nom = t.value; return; }
    var campo = t.getAttribute('data-campo');
    if (!campo || !S.ev) return;
    if (campo === 'm.comentario') { U.cambiarCampoMarca('comentario', t.value); return; }
    if (campo === 'desvio') { S.ev.decisiones[t.getAttribute('data-c')].motivoDesvio = t.value; U.tocarEv(); return; }
    if (campo === 'gcom') { var g = S.ev.generales.find(function (x) { return x.id === t.getAttribute('data-id'); }); if (g) { g.comentario = t.value; U.tocarEv(); } return; }
    if (campo === 'obs') { S.ev.observaciones = t.value; U.tocarEv(); return; }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'entMaterial') { S.borrador.materialId = t.value; return; }
    if (t.classList && t.classList.contains('img-archivo')) { agregarImagenes(t.getAttribute('data-doc'), t.files); t.value = ''; return; }
    if (t.classList && t.classList.contains('pr-mono-c')) { var ta = t.closest('.doc-ed').querySelector('.pr-texto'); ta.classList.toggle('mono', t.checked); ta.setAttribute('wrap', t.checked ? 'off' : 'soft'); return; }
    if (t.name === 'vis') { S.borrador.visibilidad = t.value; return; }
    var campo = t.getAttribute('data-campo');
    if (!campo) return;
    if (campo.indexOf('m.') === 0 && campo !== 'm.comentario') { U.cambiarCampoMarca(campo.slice(2), t.value); return; }
    if (campo === 'detector') { S.detector = t.checked; U.renderTexto(); return; }
    if (campo === 'verNumeros') { S.ocultarNumeros = !t.checked; U.renderTexto(); return; }
    if (campo === 'verMarcas') { S.ocultarMarcas = !t.checked; U.renderTexto(); return; }
    if (campo === 'solo') { S.solo = t.checked ? t.getAttribute('data-c') : null; U.renderMarcado(); return; }

(function () {

  function imagenSegura(src) { return /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(src || ''); }

  // ───────── Pintado de un documento ─────────
  // Se corta el texto en los límites de sus subrayados y se arman fragmentos escapados:

  function htmlDoc(m, d, seleccion, subElegido) {
    var t = d.texto || '';
    var h = '';

      var subs = m.subrayados.filter(function (s) { return s.documento === d.id && s.fin <= t.length; });
      var sel = seleccion && seleccion.documento === d.id ? seleccion : null;

        var cubre = subs.filter(function (s) { return s.inicio <= x && s.fin >= y; });

  // ───────── Panel de consulta al evaluar ─────────
  function renderConsulta() {
    var el = $('consulta'), m = pruebaEnUso();

    el.hidden = false;

    if (sub) h += '<button class="btn chico peligro" data-a="quitarSub">Quitar</button>';

  // ───────── Consulta de una prueba desde el historial: solo lectura ─────────

  function verEtiquetas(confirmando) {

  // ───────── Visor de imágenes ─────────
  function verImagen(docId, imgId) {

    document.body.appendChild(v);
  }
